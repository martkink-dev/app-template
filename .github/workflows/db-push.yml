name: Database migrations

# Applies supabase/migrations to the production Supabase project.
# There is no staging database: migrations are tested locally with
# `npx supabase db reset` before they are merged.
#
# Configuration (Settings -> Secrets and variables -> Actions):
#   Variables: SUPABASE_PRODUCTION_PROJECT_ID
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_PRODUCTION_DB_PASSWORD
#
# If the variable is not set (for example in the template repository),
# the job is skipped instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Never run two migration jobs at the same time, and never cancel one halfway.
concurrency:
  group: db-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Push to production
    # Production only ever receives migrations from main.
    if: ${{ github.ref == 'refs/heads/main' && vars.SUPABASE_PRODUCTION_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Uses the same Supabase CLI version as local development.
      - name: Install dependencies
        run: npm ci

      - name: Link production project
        run: npx supabase link --project-ref ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}

      - name: Apply migrations
        run: npx supabase db push
